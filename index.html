<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Forca - XANDE</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        #palavra { font-size: 3em; letter-spacing: 15px; margin: 20px; font-weight: bold; color: #333; }
        .status { margin: 20px; font-size: 1.2em; }
        input { padding: 10px; font-size: 1.2em; width: 50px; text-align: center; }
        button { padding: 10px 20px; font-size: 1.2em; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🎮 Jogo da Forca</h1>

    <div id="palavra">_ _ _ _ _</div>

    <div class="status">
        Erros: <span id="erros" style="color: red;">0</span> / 6
    </div>

    <input type="text" id="letra" maxlength="1" autofocus>
    <button onclick="chutar()">Chutar</button>

    <script>
        // Configurações
        const secreta = "XANDE";
        let exibicao = ["_", "_", "_", "_", "_"];
        let erros = 0;

        function chutar() {
            const input = document.getElementById("letra");
            let letra = input.value.toUpperCase();
            input.value = "";
            input.focus();

            if (!letra || letra === " ") return;

            if (secreta.includes(letra)) {
                for(let i = 0; i < secreta.length; i++) {
                    if(secreta[i] === letra) {
                        exibicao[i] = letra;
                    }
                }
            } else {
                erros++;
            }
            
            // Atualiza a tela
            document.getElementById("palavra").innerText = exibicao.join(" ");
            document.getElementById("erros").innerText = erros;

            // Fim de jogo
            setTimeout(() => {
                if (!exibicao.includes("_")) {
                    alert("Você venceu! A palavra era XANDE");
                    location.reload();
                } else if (erros >= 6) {
                    alert("Game Over! Tente novamente.");
                    location.reload();
                }
            }, 100);
        }
    </script>
</body>
</html>
